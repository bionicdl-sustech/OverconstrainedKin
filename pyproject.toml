[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ov_kin"
version = "0.1.0"
description = "Analytical PyTorch kinematics, velocity, and statics solver for overconstrained quadruped limbs (Bennett, Planar, and Spherical linkages)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
viz = [
    "numpy",
    "viser",
    "yourdfpy",
    "trimesh",
    "scipy",
]

[tool.setuptools.packages.find]
include = ["ov_kin*"]
exclude = ["assets*", "examples*"]
